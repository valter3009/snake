<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка - Классическая игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        #gameCanvas {
            background: #000;
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: block;
            margin: 0 auto;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            color: white;
            font-size: 1.2em;
        }

        .score-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            min-width: 150px;
        }

        .score-label {
            font-size: 0.8em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            min-width: 300px;
        }

        #gameOverScreen {
            display: none;
        }

        .game-screen h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .game-screen p {
            font-size: 1.1em;
            margin: 10px 0;
            opacity: 0.8;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        button:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .controls {
            color: white;
            margin-top: 15px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .emoji {
            font-size: 3em;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            #gameCanvas {
                width: 90vw;
                height: 90vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Змейка</h1>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">Счет</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Рекорд</div>
                <div class="score-value" id="highScore">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            Управление: ← ↑ → ↓ или WASD | Пробел: Пауза
        </div>

        <div id="startScreen" class="game-screen">
            <div class="emoji">🐍</div>
            <h2>Добро пожаловать!</h2>
            <p>Собирайте еду и растите</p>
            <p>Не врезайтесь в стены и себя</p>
            <button onclick="startGame()">Начать игру</button>
        </div>

        <div id="gameOverScreen" class="game-screen">
            <div class="emoji">💥</div>
            <h2>Игра окончена!</h2>
            <p>Ваш счет: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Играть снова</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreElement = document.getElementById('finalScore');

        // Настройки игры
        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        // Игровые переменные
        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameLoop;

        // Инициализация
        highScoreElement.textContent = highScore;

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gamePaused = false;
            generateFood();
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * TILE_COUNT),
                y: Math.floor(Math.random() * TILE_COUNT)
            };

            // Проверка, что еда не на змее
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }

        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            initGame();
            gameRunning = true;
            gameLoop = setInterval(update, 100);
        }

        function restartGame() {
            startGame();
        }

        function update() {
            if (!gameRunning || gamePaused) return;

            // Движение змеи
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Проверка столкновения со стенами
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // Проверка столкновения с собой
            for (let segment of snake) {
                if (segment.x === head.x && segment.y === head.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Проверка поедания еды
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                generateFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Очистка canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем сетку
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 1;
            for (let i = 0; i < TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // Рисуем змею
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Голова
                    ctx.fillStyle = '#4CAF50';
                } else {
                    // Тело
                    ctx.fillStyle = '#8BC34A';
                }
                ctx.fillRect(
                    segment.x * GRID_SIZE + 1,
                    segment.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );

                // Глаза на голове
                if (index === 0) {
                    ctx.fillStyle = '#fff';
                    const eyeSize = 3;
                    if (dx === 1) { // Вправо
                        ctx.fillRect(segment.x * GRID_SIZE + 12, segment.y * GRID_SIZE + 6, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * GRID_SIZE + 12, segment.y * GRID_SIZE + 11, eyeSize, eyeSize);
                    } else if (dx === -1) { // Влево
                        ctx.fillRect(segment.x * GRID_SIZE + 5, segment.y * GRID_SIZE + 6, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * GRID_SIZE + 5, segment.y * GRID_SIZE + 11, eyeSize, eyeSize);
                    } else if (dy === -1) { // Вверх
                        ctx.fillRect(segment.x * GRID_SIZE + 6, segment.y * GRID_SIZE + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * GRID_SIZE + 11, segment.y * GRID_SIZE + 5, eyeSize, eyeSize);
                    } else if (dy === 1) { // Вниз
                        ctx.fillRect(segment.x * GRID_SIZE + 6, segment.y * GRID_SIZE + 12, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * GRID_SIZE + 11, segment.y * GRID_SIZE + 12, eyeSize, eyeSize);
                    }
                }
            });

            // Рисуем еду
            ctx.fillStyle = '#FF5722';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // Мигающая анимация еды
            ctx.strokeStyle = '#FFC107';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);

            // Обновление рекорда
            if (score > highScore) {
                highScore = score;
                highScoreElement.textContent = highScore;
                localStorage.setItem('snakeHighScore', highScore);
            }

            finalScoreElement.textContent = score;
            gameOverScreen.style.display = 'block';
        }

        // Управление
        document.addEventListener('keydown', (e) => {
            if (!gameRunning && e.code === 'Space') {
                startGame();
                return;
            }

            if (e.code === 'Space') {
                gamePaused = !gamePaused;
                return;
            }

            // Предотвращаем разворот на 180 градусов
            if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && dy === 0) {
                dx = 0;
                dy = -1;
            } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && dy === 0) {
                dx = 0;
                dy = 1;
            } else if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && dx === 0) {
                dx = -1;
                dy = 0;
            } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && dx === 0) {
                dx = 1;
                dy = 0;
            }

            // Предотвращаем скролл страницы
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
        });

        // Рисуем начальное состояние
        draw();
    </script>
</body>
</html>
