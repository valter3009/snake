<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Шутер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 100;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }

        #crosshair::after {
            width: 100%;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
            font-weight: bold;
        }

        #ui div {
            margin-bottom: 10px;
        }

        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 10px;
            z-index: 1000;
        }

        #instructions h2 {
            margin-bottom: 20px;
        }

        #instructions p {
            margin: 10px 0;
            font-size: 18px;
        }

        #instructions button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #instructions button:hover {
            background: #45a049;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui">
            <div>Счет: <span id="score">0</span></div>
            <div>Патроны: <span id="ammo">30</span> / ∞</div>
            <div>Попадания: <span id="hits">0</span></div>
        </div>
        <div id="crosshair"></div>
        <div id="instructions">
            <h2>3D Шутер</h2>
            <p>WASD - Движение</p>
            <p>Мышь - Обзор</p>
            <p>ЛКМ - Стрельба</p>
            <p>R - Перезарядка</p>
            <p>Пробел - Прыжок</p>
            <button id="start-button">Начать игру</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Основные переменные
        let scene, camera, renderer, controls;
        let player = {
            velocity: new THREE.Vector3(),
            position: new THREE.Vector3(0, 2, 10),
            height: 2,
            speed: 0.15,
            jumpSpeed: 0.3,
            gravity: 0.015,
            onGround: true
        };

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = true;

        let mouse = { x: 0, y: 0 };
        let yaw = 0, pitch = 0;

        let weapon = {
            ammo: 30,
            maxAmmo: 30,
            reloading: false,
            lastShot: 0,
            fireRate: 150
        };

        let targets = [];
        let score = 0;
        let hits = 0;

        let raycaster = new THREE.Raycaster();
        let clock = new THREE.Clock();

        // Инициализация
        function init() {
            // Создание сцены
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 0, 100);

            // Камера
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(player.position);

            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 50, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 200;
            sunLight.shadow.camera.left = -50;
            sunLight.shadow.camera.right = 50;
            sunLight.shadow.camera.top = 50;
            sunLight.shadow.camera.bottom = -50;
            scene.add(sunLight);

            // Земля
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x3a5f0b,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Создание зданий
            createBuildings();

            // Создание мишеней
            createTargets();

            // Обработчики событий
            window.addEventListener('resize', onWindowResize);
        }

        function createBuildings() {
            const buildingMaterial = new THREE.MeshStandardMaterial({
                color: 0x808080,
                roughness: 0.7
            });

            const roofMaterial = new THREE.MeshStandardMaterial({
                color: 0x8B4513,
                roughness: 0.9
            });

            // Здание 1
            const building1 = new THREE.Mesh(
                new THREE.BoxGeometry(8, 6, 8),
                buildingMaterial
            );
            building1.position.set(-15, 3, -15);
            building1.castShadow = true;
            building1.receiveShadow = true;
            scene.add(building1);

            const roof1 = new THREE.Mesh(
                new THREE.BoxGeometry(8.5, 0.5, 8.5),
                roofMaterial
            );
            roof1.position.set(-15, 6.25, -15);
            roof1.castShadow = true;
            scene.add(roof1);

            // Здание 2
            const building2 = new THREE.Mesh(
                new THREE.BoxGeometry(10, 8, 6),
                buildingMaterial
            );
            building2.position.set(15, 4, -10);
            building2.castShadow = true;
            building2.receiveShadow = true;
            scene.add(building2);

            const roof2 = new THREE.Mesh(
                new THREE.BoxGeometry(10.5, 0.5, 6.5),
                roofMaterial
            );
            roof2.position.set(15, 8.25, -10);
            roof2.castShadow = true;
            scene.add(roof2);

            // Здание 3
            const building3 = new THREE.Mesh(
                new THREE.BoxGeometry(6, 5, 10),
                buildingMaterial
            );
            building3.position.set(-20, 2.5, 15);
            building3.castShadow = true;
            building3.receiveShadow = true;
            scene.add(building3);

            const roof3 = new THREE.Mesh(
                new THREE.BoxGeometry(6.5, 0.5, 10.5),
                roofMaterial
            );
            roof3.position.set(-20, 5.25, 15);
            roof3.castShadow = true;
            scene.add(roof3);

            // Здание 4 (небольшое)
            const building4 = new THREE.Mesh(
                new THREE.BoxGeometry(5, 4, 5),
                buildingMaterial
            );
            building4.position.set(10, 2, 20);
            building4.castShadow = true;
            building4.receiveShadow = true;
            scene.add(building4);

            const roof4 = new THREE.Mesh(
                new THREE.BoxGeometry(5.5, 0.5, 5.5),
                roofMaterial
            );
            roof4.position.set(10, 4.25, 20);
            roof4.castShadow = true;
            scene.add(roof4);

            // Стены по периметру
            const wallMaterial = new THREE.MeshStandardMaterial({
                color: 0x654321,
                roughness: 0.8
            });

            // Создаем несколько стен
            const walls = [
                { pos: [0, 1.5, -30], size: [40, 3, 1] },
                { pos: [0, 1.5, 30], size: [40, 3, 1] },
                { pos: [-30, 1.5, 0], size: [1, 3, 40] },
                { pos: [30, 1.5, 0], size: [1, 3, 40] }
            ];

            walls.forEach(wall => {
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(...wall.size),
                    wallMaterial
                );
                mesh.position.set(...wall.pos);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });

            // Ящики для укрытия
            const boxMaterial = new THREE.MeshStandardMaterial({
                color: 0x8B7355,
                roughness: 0.9
            });

            const boxes = [
                { pos: [5, 0.5, 5], size: [2, 2, 2] },
                { pos: [-8, 0.5, 8], size: [2, 2, 2] },
                { pos: [0, 0.5, -5], size: [1.5, 1.5, 1.5] },
                { pos: [-5, 0.5, -8], size: [1.5, 1.5, 1.5] }
            ];

            boxes.forEach(box => {
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(...box.size),
                    boxMaterial
                );
                mesh.position.set(...box.pos);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });
        }

        function createTargets() {
            const targetPositions = [
                { pos: [-15, 2, -10], color: 0xff0000 },
                { pos: [12, 2, -8], color: 0xff0000 },
                { pos: [-18, 2, 12], color: 0xff0000 },
                { pos: [8, 2, 18], color: 0xff0000 },
                { pos: [0, 2, -20], color: 0xff0000 },
                { pos: [-25, 2, 0], color: 0xff0000 },
                { pos: [20, 2, 5], color: 0xff0000 }
            ];

            targetPositions.forEach((targetData, index) => {
                // Основная часть мишени
                const targetGeometry = new THREE.CylinderGeometry(0.8, 0.8, 2, 32);
                const targetMaterial = new THREE.MeshStandardMaterial({
                    color: targetData.color,
                    emissive: targetData.color,
                    emissiveIntensity: 0.2
                });
                const target = new THREE.Mesh(targetGeometry, targetMaterial);
                target.position.set(...targetData.pos);
                target.castShadow = true;
                target.userData.isTarget = true;
                target.userData.id = index;
                target.userData.active = true;
                scene.add(target);

                // Белый центр мишени
                const centerGeometry = new THREE.CylinderGeometry(0.3, 0.3, 2.1, 32);
                const centerMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff
                });
                const center = new THREE.Mesh(centerGeometry, centerMaterial);
                center.position.copy(target.position);
                center.userData.isTarget = true;
                center.userData.id = index;
                center.userData.active = true;
                scene.add(center);

                targets.push({ main: target, center: center, active: true });
            });
        }

        function shoot() {
            const now = Date.now();

            if (weapon.reloading || weapon.ammo <= 0 || now - weapon.lastShot < weapon.fireRate) {
                return;
            }

            weapon.lastShot = now;
            weapon.ammo--;
            updateUI();

            // Звук выстрела (визуальный эффект)
            flashScreen();

            // Raycasting для попадания
            raycaster.setFromCamera({ x: 0, y: 0 }, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            for (let intersect of intersects) {
                if (intersect.object.userData.isTarget && intersect.object.userData.active) {
                    hitTarget(intersect.object.userData.id);
                    break;
                }
            }
        }

        function hitTarget(id) {
            if (targets[id] && targets[id].active) {
                targets[id].active = false;
                targets[id].main.userData.active = false;
                targets[id].center.userData.active = false;

                // Анимация попадания
                const target = targets[id].main;
                const center = targets[id].center;

                let fallRotation = 0;
                const fallInterval = setInterval(() => {
                    fallRotation += 0.1;
                    target.rotation.x = fallRotation;
                    center.rotation.x = fallRotation;

                    if (fallRotation >= Math.PI / 2) {
                        clearInterval(fallInterval);

                        // Респаун мишени через 3 секунды
                        setTimeout(() => {
                            target.rotation.x = 0;
                            center.rotation.x = 0;
                            targets[id].active = true;
                            target.userData.active = true;
                            center.userData.active = true;
                        }, 3000);
                    }
                }, 16);

                score += 100;
                hits++;
                updateUI();
            }
        }

        function reload() {
            if (weapon.reloading || weapon.ammo === weapon.maxAmmo) return;

            weapon.reloading = true;

            setTimeout(() => {
                weapon.ammo = weapon.maxAmmo;
                weapon.reloading = false;
                updateUI();
            }, 1500);
        }

        function flashScreen() {
            const flash = document.createElement('div');
            flash.style.position = 'absolute';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.background = 'rgba(255, 255, 255, 0.3)';
            flash.style.pointerEvents = 'none';
            document.getElementById('game-container').appendChild(flash);

            setTimeout(() => flash.remove(), 50);
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('ammo').textContent = weapon.ammo;
            document.getElementById('hits').textContent = hits;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updatePlayerMovement() {
            // Применение гравитации
            if (!player.onGround) {
                player.velocity.y -= player.gravity;
            }

            // Горизонтальное движение
            const direction = new THREE.Vector3();
            const right = new THREE.Vector3();

            camera.getWorldDirection(direction);
            direction.y = 0;
            direction.normalize();

            right.crossVectors(camera.up, direction).normalize();

            const moveVector = new THREE.Vector3();

            if (moveForward) moveVector.add(direction);
            if (moveBackward) moveVector.sub(direction);
            if (moveLeft) moveVector.add(right);
            if (moveRight) moveVector.sub(right);

            if (moveVector.length() > 0) {
                moveVector.normalize();
                player.velocity.x = moveVector.x * player.speed;
                player.velocity.z = moveVector.z * player.speed;
            } else {
                player.velocity.x = 0;
                player.velocity.z = 0;
            }

            // Обновление позиции
            player.position.add(player.velocity);

            // Проверка столкновения с землей
            if (player.position.y <= player.height) {
                player.position.y = player.height;
                player.velocity.y = 0;
                player.onGround = true;
                canJump = true;
            } else {
                player.onGround = false;
            }

            // Ограничение области движения
            const boundary = 28;
            player.position.x = Math.max(-boundary, Math.min(boundary, player.position.x));
            player.position.z = Math.max(-boundary, Math.min(boundary, player.position.z));

            camera.position.copy(player.position);
        }

        function animate() {
            requestAnimationFrame(animate);

            updatePlayerMovement();

            // Обновление поворота камеры
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            renderer.render(scene, camera);
        }

        // Управление
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space':
                    if (canJump && player.onGround) {
                        player.velocity.y = player.jumpSpeed;
                        canJump = false;
                    }
                    e.preventDefault();
                    break;
                case 'KeyR':
                    reload();
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        document.addEventListener('click', () => {
            if (document.pointerLockElement === renderer.domElement) {
                shoot();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            }
        });

        // Начало игры
        document.getElementById('start-button').addEventListener('click', () => {
            document.getElementById('instructions').classList.add('hidden');
            renderer.domElement.requestPointerLock();
            init();
            animate();
        });

        document.addEventListener('pointerlockchange', () => {
            if (!document.pointerLockElement) {
                // Можно показать паузу или меню
            }
        });
    </script>
</body>
</html>
